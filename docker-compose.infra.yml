# Shared infrastructure — runs ONCE per machine, across every project copy.
#
# Rules for editing this file:
#   - Redis belongs here, never in docker-compose.yml.
#   - `name: infra` makes this the machine's one shared infra compose project,
#     so `make infra` from any copy converges on the same containers.
#   - Infra ports are machine-level. App ports are auto-picked per copy by
#     scripts/setup/env.sh — see docker-compose.yml.
name: infra

services:
  # Caches gateway answers (app/core/ai/cache.py); the app fails open
  # without it.
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-56379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 3s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: 0.5

volumes:
  redis_data:
