server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Generated media + API are served by the backend; the client builds
    # absolute URLs from VITE_API_URL, so no proxying is needed here.
}
